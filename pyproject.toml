[project]
name = "docextract"
version = "0.1.0"
description = "Invoice and receipt extraction to validated JSON / Excel: OCR + LLM vs vision-language model."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's `files = File(...)` default is the framework's documented pattern
